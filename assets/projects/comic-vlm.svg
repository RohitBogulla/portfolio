<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24413c"/>
      <stop offset="55%" stop-color="#1c2027"/>
      <stop offset="100%" stop-color="#1b1e24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5" fill="#9198a6">// vision · vlm benchmarking</text>

  <!-- comic panel grid -->
  <g stroke="#333844" stroke-width="2" fill="#22262e">
    <rect x="140" y="120" width="200" height="140" rx="4"/>
    <rect x="360" y="120" width="140" height="140" rx="4"/>
    <rect x="140" y="280" width="140" height="110" rx="4"/>
    <rect x="300" y="280" width="200" height="110" rx="4"/>
  </g>

  <!-- panel 1: speech bubble -->
  <g>
    <path d="M175 150 h100 a10 10 0 0 1 10 10 v40 a10 10 0 0 1 -10 10 h-60 l-20 20 v-20 h-20 a10 10 0 0 1 -10 -10 v-40 a10 10 0 0 1 10 -10 z"
          fill="none" stroke="#5eead4" stroke-width="1.6"/>
    <circle cx="205" cy="185" r="3" fill="#5eead4"/>
    <circle cx="225" cy="185" r="3" fill="#5eead4"/>
    <circle cx="245" cy="185" r="3" fill="#5eead4"/>
  </g>

  <!-- panel 2: eye / accessibility -->
  <g stroke="#d9a566" stroke-width="1.8" fill="none">
    <path d="M385 195 Q 430 165 475 195 Q 430 225 385 195 Z"/>
    <circle cx="430" cy="195" r="12" fill="#d9a566" fill-opacity="0.15"/>
    <circle cx="430" cy="195" r="5" fill="#d9a566"/>
  </g>

  <!-- panel 3: scan lines -->
  <g stroke="#5c6373" stroke-width="2" stroke-linecap="round">
    <line x1="165" y1="310" x2="255" y2="310"/>
    <line x1="165" y1="325" x2="235" y2="325"/>
    <line x1="165" y1="340" x2="255" y2="340"/>
    <line x1="165" y1="355" x2="215" y2="355"/>
  </g>

  <!-- panel 4: model comparison bars -->
  <g fill="#5eead4">
    <rect x="330" y="355" width="14" height="24" opacity="0.9"/>
    <rect x="354" y="335" width="14" height="44" opacity="0.75"/>
    <rect x="378" y="345" width="14" height="34" opacity="0.6"/>
    <rect x="402" y="320" width="14" height="59" opacity="0.9"/>
    <rect x="426" y="350" width="14" height="29" opacity="0.5"/>
    <rect x="450" y="360" width="14" height="19" opacity="0.4"/>
  </g>
</svg>
