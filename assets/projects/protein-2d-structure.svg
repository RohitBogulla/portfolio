<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24413c"/>
      <stop offset="55%" stop-color="#1c2027"/>
      <stop offset="100%" stop-color="#1b1e24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <pattern id="lattice" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.6" fill="#3a4048"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5" fill="#9198a6">// lattice · hp folding</text>

  <!-- lattice grid -->
  <rect x="160" y="100" width="480" height="280" fill="url(#lattice)"/>

  <!-- folded chain path through lattice points (46px grid, origin 160,100) -->
  <g stroke="#5c6373" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 146 L 252 146 L 298 146 L 298 192 L 252 192 L 206 192 L 206 238 L 206 284
             L 252 284 L 298 284 L 344 284 L 344 238 L 344 192 L 390 192 L 436 192 L 436 146
             L 482 146 L 528 146 L 528 192 L 528 238 L 482 238 L 482 284 L 528 284 L 574 284"/>
  </g>

  <!-- residues: alternating hydrophobic (teal) / polar (amber) -->
  <g>
    <circle cx="206" cy="146" r="7" fill="#5eead4"/>
    <circle cx="252" cy="146" r="7" fill="#d9a566"/>
    <circle cx="298" cy="146" r="7" fill="#5eead4"/>
    <circle cx="298" cy="192" r="7" fill="#d9a566"/>
    <circle cx="252" cy="192" r="7" fill="#5eead4"/>
    <circle cx="206" cy="192" r="7" fill="#d9a566"/>
    <circle cx="206" cy="238" r="7" fill="#5eead4"/>
    <circle cx="206" cy="284" r="7" fill="#d9a566"/>
    <circle cx="252" cy="284" r="7" fill="#5eead4"/>
    <circle cx="298" cy="284" r="7" fill="#d9a566"/>
    <circle cx="344" cy="284" r="7" fill="#5eead4"/>
    <circle cx="344" cy="238" r="7" fill="#d9a566"/>
    <circle cx="344" cy="192" r="7" fill="#5eead4"/>
    <circle cx="390" cy="192" r="7" fill="#d9a566"/>
    <circle cx="436" cy="192" r="7" fill="#5eead4"/>
    <circle cx="436" cy="146" r="7" fill="#d9a566"/>
    <circle cx="482" cy="146" r="7" fill="#5eead4"/>
    <circle cx="528" cy="146" r="7" fill="#d9a566"/>
    <circle cx="528" cy="192" r="7" fill="#5eead4"/>
    <circle cx="528" cy="238" r="7" fill="#d9a566"/>
    <circle cx="482" cy="238" r="7" fill="#5eead4"/>
    <circle cx="482" cy="284" r="7" fill="#d9a566"/>
    <circle cx="528" cy="284" r="7" fill="#5eead4"/>
    <circle cx="574" cy="284" r="7" fill="#d9a566"/>
  </g>
  <text x="380" y="410" font-family="JetBrains Mono, monospace" font-size="11" fill="#5c6373">H-H contact minimization</text>
</svg>
