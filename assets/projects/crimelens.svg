<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24413c"/>
      <stop offset="55%" stop-color="#1c2027"/>
      <stop offset="100%" stop-color="#1b1e24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5" fill="#9198a6">// graph · nlp to gcn</text>

  <!-- stacked documents -->
  <g>
    <rect x="90" y="150" width="120" height="150" rx="6" fill="#22262e" stroke="#333844" stroke-width="1.5" transform="rotate(-4 150 225)"/>
    <rect x="100" y="140" width="120" height="150" rx="6" fill="#262b34" stroke="#333844" stroke-width="1.5" transform="rotate(2 160 215)"/>
    <g stroke="#5c6373" stroke-width="2" stroke-linecap="round">
      <line x1="120" y1="165" x2="195" y2="165"/>
      <line x1="120" y1="180" x2="185" y2="180"/>
      <line x1="120" y1="195" x2="195" y2="195"/>
      <line x1="120" y1="210" x2="170" y2="210"/>
    </g>
  </g>

  <!-- arrow -->
  <g stroke="#333844" stroke-width="1.5" fill="none">
    <path d="M255 225 L 330 225" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333844"/>
    </marker>
  </defs>

  <!-- entity graph -->
  <g stroke="#3a4048" stroke-width="1.3">
    <line x1="420" y1="180" x2="500" y2="150"/>
    <line x1="420" y1="180" x2="480" y2="230"/>
    <line x1="480" y1="230" x2="560" y2="210"/>
    <line x1="480" y1="230" x2="520" y2="300"/>
    <line x1="560" y1="210" x2="640" y2="180"/>
    <line x1="520" y1="300" x2="600" y2="320"/>
  </g>
  <g>
    <circle cx="420" cy="180" r="9" fill="#5eead4"/>
    <circle cx="500" cy="150" r="7" fill="#22262e" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="480" cy="230" r="12" fill="#d9a566"/>
    <circle cx="560" cy="210" r="7" fill="#22262e" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="640" cy="180" r="7" fill="#22262e" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="520" cy="300" r="7" fill="#22262e" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="600" cy="320" r="7" fill="#22262e" stroke="#5eead4" stroke-width="1.5"/>
  </g>
  <text x="455" y="345" font-family="JetBrains Mono, monospace" font-size="11" fill="#5c6373">classified event</text>
</svg>
