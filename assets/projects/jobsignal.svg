<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24413c"/>
      <stop offset="55%" stop-color="#1c2027"/>
      <stop offset="100%" stop-color="#1b1e24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5" fill="#9198a6">// stream · kafka + spark</text>

  <!-- three partitions -->
  <g stroke="#333844" stroke-width="1.5">
    <rect x="90" y="140" width="150" height="46" rx="6" fill="#22262e"/>
    <rect x="90" y="202" width="150" height="46" rx="6" fill="#22262e"/>
    <rect x="90" y="264" width="150" height="46" rx="6" fill="#22262e"/>
  </g>
  <g fill="#5c6373" font-family="JetBrains Mono, monospace" font-size="11">
    <text x="104" y="167">partition 0</text>
    <text x="104" y="229">partition 1</text>
    <text x="104" y="291">partition 2</text>
  </g>

  <!-- flowing particles -->
  <g>
    <circle cx="270" cy="163" r="6" fill="#5eead4"/>
    <circle cx="320" cy="163" r="5" fill="#5eead4" opacity="0.55"/>
    <circle cx="365" cy="163" r="4" fill="#5eead4" opacity="0.3"/>

    <circle cx="290" cy="225" r="6" fill="#d9a566"/>
    <circle cx="340" cy="225" r="5" fill="#d9a566" opacity="0.55"/>
    <circle cx="385" cy="225" r="4" fill="#d9a566" opacity="0.3"/>

    <circle cx="260" cy="287" r="6" fill="#5eead4"/>
    <circle cx="310" cy="287" r="5" fill="#5eead4" opacity="0.55"/>
    <circle cx="355" cy="287" r="4" fill="#5eead4" opacity="0.3"/>
  </g>

  <!-- convergence lines to model node -->
  <g stroke="#333844" stroke-width="1.5" fill="none">
    <path d="M420 163 Q 540 163 590 225"/>
    <path d="M420 225 L 590 225"/>
    <path d="M420 287 Q 540 287 590 225"/>
  </g>

  <!-- model node -->
  <circle cx="620" cy="225" r="26" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.35"/>
  <circle cx="620" cy="225" r="18" fill="none" stroke="#5eead4" stroke-width="1.2" opacity="0.6"/>
  <circle cx="620" cy="225" r="10" fill="#5eead4"/>
  <text x="590" y="270" font-family="JetBrains Mono, monospace" font-size="11" fill="#5c6373">distilbert</text>
</svg>
