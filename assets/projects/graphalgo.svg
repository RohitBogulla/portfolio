<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24413c"/>
      <stop offset="55%" stop-color="#1c2027"/>
      <stop offset="100%" stop-color="#1b1e24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.5" fill="#9198a6">// graph · dijkstra at scale</text>

  <!-- background mesh edges -->
  <g stroke="#2e333c" stroke-width="1.2">
    <line x1="150" y1="140" x2="230" y2="200"/>
    <line x1="150" y1="140" x2="120" y2="220"/>
    <line x1="230" y1="200" x2="300" y2="150"/>
    <line x1="230" y1="200" x2="280" y2="280"/>
    <line x1="120" y1="220" x2="180" y2="320"/>
    <line x1="300" y1="150" x2="400" y2="180"/>
    <line x1="280" y1="280" x2="380" y2="300"/>
    <line x1="180" y1="320" x2="280" y2="280"/>
    <line x1="400" y1="180" x2="480" y2="230"/>
    <line x1="380" y1="300" x2="480" y2="230"/>
    <line x1="480" y1="230" x2="580" y2="200"/>
    <line x1="480" y1="230" x2="560" y2="310"/>
    <line x1="580" y1="200" x2="650" y2="250"/>
    <line x1="560" y1="310" x2="650" y2="250"/>
    <line x1="650" y1="250" x2="680" y2="170"/>
  </g>

  <!-- highlighted shortest path -->
  <g stroke="#d9a566" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M150 140 L 230 200 L 400 180 L 480 230 L 650 250"/>
  </g>

  <!-- nodes -->
  <g fill="#22262e" stroke="#5eead4" stroke-width="1.5">
    <circle cx="150" cy="140" r="7"/>
    <circle cx="120" cy="220" r="6"/>
    <circle cx="300" cy="150" r="6"/>
    <circle cx="280" cy="280" r="6"/>
    <circle cx="180" cy="320" r="6"/>
    <circle cx="380" cy="300" r="6"/>
    <circle cx="580" cy="200" r="6"/>
    <circle cx="560" cy="310" r="6"/>
    <circle cx="680" cy="170" r="6"/>
  </g>
  <g fill="#d9a566">
    <circle cx="230" cy="200" r="7"/>
    <circle cx="400" cy="180" r="7"/>
    <circle cx="480" cy="230" r="7"/>
    <circle cx="650" cy="250" r="7"/>
  </g>
  <text x="150" y="360" font-family="JetBrains Mono, monospace" font-size="11" fill="#5c6373">2.3M nodes · 34M edges</text>
</svg>
